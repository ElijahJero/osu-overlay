services:
  overlay:
    image: ghcr.io/elijahjero/osu-overlay:latest
    build: .
    ports:
      - "8727:8727"
    environment:
      OSU_HOST: "0.0.0.0"
      OSU_PORT: "8727"
      OSU_CLIENT_ID: ${OSU_CLIENT_ID:-}
      OSU_CLIENT_SECRET: ${OSU_CLIENT_SECRET:-}
      # always, never, or christmas (Dec 15–25: Christmas and the 10 days before)
      OSU_CHRISTMAS: ${OSU_CHRISTMAS:-christmas}
      TZ: ${TZ:-America/New_York}
    restart: unless-stopped
    volumes:
      - cache:/app/cache

volumes:
  cache:
